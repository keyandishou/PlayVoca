<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayVoca</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
    }

    main {
      box-sizing: border-box;
      width: min(100% - 2rem, 760px);
      margin: 4rem auto;
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin-top: 0;
      line-height: 1.2;
    }

    a {
      color: #2563eb;
      text-underline-offset: 0.2em;
    }

    a:hover,
    a:focus-visible {
      color: #1d4ed8;
    }

    @media (max-width: 520px) {
      main {
        margin: 1rem auto;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #e5e7eb;
      }

      main {
        border-color: #374151;
        background: #1f2937;
        box-shadow: none;
      }

      a {
        color: #93c5fd;
      }

      a:hover,
      a:focus-visible {
        color: #bfdbfe;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>PlayVoca</h1>
    <p>PlayVoca is an AI-assisted language learning tool for games.</p>
    <p><a href="privacy.html">Privacy Policy</a></p>
  </main>
</body>
</html>
